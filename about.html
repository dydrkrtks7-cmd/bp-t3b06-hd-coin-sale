    <style>
        /* ===== Brutalist Avant-Garde System — Kr Neon Void ===== */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --bg-card-hover: #222222;
            --border-color: #2a2a2a;
            --border-accent: #00ff88;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --text-accent: #00ff88;
            --text-highlight: #ff00ff;
            --neon-green: #00ff88;
            --neon-pink: #ff00ff;
            --neon-blue: #00bfff;
            --neon-yellow: #ffdd00;
            --shadow-neon: 0 0 10px rgba(0,255,136,0.3), 0 0 20px rgba(0,255,136,0.1);
            --shadow-card: 0 4px 12px rgba(0,0,0,0.6);
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            --transition-fast: 0.2s ease;
            --transition-med: 0.35s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--text-accent);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        a:hover {
            color: var(--text-highlight);
        }

        /* ===== hamburger-menu pattern ===== */
        .hamburger-menu {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            width: 32px;
            gap: 6px;
            padding: 4px;
            background: transparent;
            border: none;
        }
        .hamburger-menu span {
            display: block;
            height: 3px;
            width: 100%;
            background: var(--text-primary);
            transition: all var(--transition-med);
            border-radius: 2px;
        }
        .hamburger-menu.active span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }
        .hamburger-menu.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-menu.active span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* ===== layout ===== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-card);
        }
        .site-header .logo {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--neon-green);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .site-header .logo span {
            color: var(--neon-pink);
        }
        .nav-wrapper {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .nav-links {
            display: flex;
            gap: 1.2rem;
            list-style: none;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .nav-links li a {
            padding: 0.3rem 0.6rem;
            border: 1px solid transparent;
            transition: all var(--transition-fast);
        }
        .nav-links li a:hover {
            border-color: var(--border-accent);
            color: var(--neon-green);
        }
        .nav-links li a.active {
            border-color: var(--border-accent);
            color: var(--neon-green);
            background: rgba(0,255,136,0.08);
        }

        .main-content {
            flex: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            width: 100%;
        }

        .hero-section {
            margin-bottom: 3rem;
            border-left: 6px solid var(--neon-green);
            padding-left: 1.5rem;
        }
        .hero-section h1 {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 0.75rem;
        }
        .hero-section h1 .highlight {
            color: var(--neon-green);
            text-shadow: var(--shadow-neon);
        }
        .hero-section .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 720px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0;
            padding: 1.5rem;
            transition: all var(--transition-med);
            box-shadow: var(--shadow-card);
        }
        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-accent);
            transform: translateY(-2px);
        }
        .card h2 {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--neon-green);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        .card h2 .accent {
            color: var(--neon-pink);
        }
        .card p {
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }
        .card .stat {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            padding: 0.4rem 0;
            border-bottom: 1px dashed rgba(255,255,255,0.07);
        }
        .card .stat .label {
            color: var(--text-secondary);
        }
        .card .stat .value {
            font-weight: 600;
            color: var(--text-primary);
        }
        .card .stat .value.green {
            color: var(--neon-green);
        }
        .card .stat .value.pink {
            color: var(--neon-pink);
        }

        .code-block {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            padding: 0.8rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--neon-green);
            margin: 0.5rem 0;
            word-break: break-all;
            display: inline-block;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.9rem;
        }
        .data-table th {
            background: #151515;
            color: var(--neon-green);
            font-family: var(--font-mono);
            padding: 0.6rem 0.8rem;
            text-align: left;
            border-bottom: 2px solid var(--border-accent);
        }
        .data-table td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .data-table tr:hover td {
            background: rgba(0,255,136,0.04);
        }
        .data-table .highlight-row td {
            color: var(--text-primary);
            background: rgba(255,0,255,0.06);
        }

        .faq-section {
            margin-top: 3rem;
        }
        .faq-section h2 {
            font-family: var(--font-mono);
            font-size: 1.6rem;
            color: var(--neon-green);
            border-left: 4px solid var(--neon-pink);
            padding-left: 1rem;
            margin-bottom: 1.5rem;
        }
        .faq-item {
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 0;
        }
        .faq-item .question {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
            cursor: default;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .faq-item .question::before {
            content: "▶";
            color: var(--neon-green);
            font-size: 0.7rem;
        }
        .faq-item .answer {
            color: var(--text-secondary);
            padding-left: 1.6rem;
            font-size: 0.95rem;
        }

        .insight-box {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            border: 1px solid var(--neon-blue);
            padding: 1.5rem;
            margin: 2rem 0;
            position: relative;
        }
        .insight-box::before {
            content: "📊 DATA INSIGHT";
            position: absolute;
            top: -12px;
            left: 16px;
            background: var(--bg-primary);
            padding: 0 0.6rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--neon-blue);
            letter-spacing: 1px;
        }
        .insight-box p {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .insight-box .number {
            color: var(--neon-yellow);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .site-footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .site-footer a {
            color: var(--neon-green);
        }

        /* ===== responsive ===== */
        @media (max-width: 768px) {
            .site-header {
                padding: 0.5rem 1rem;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                background: var(--bg-secondary);
                position: absolute;
                top: 100%;
                right: 0;
                left: 0;
                padding: 1rem;
                border-bottom: 2px solid var(--border-color);
                gap: 0.6rem;
            }
            .nav-links.open {
                display: flex;
            }
            .hamburger-menu {
                display: flex;
            }
            .hero-section h1 {
                font-size: 1.8rem;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
            .data-table {
                font-size: 0.8rem;
            }
            .data-table th, .data-table td {
                padding: 0.4rem 0.5rem;
            }
        }

        @media (min-width: 769px) {
            .hamburger-menu {
                display: none;
            }
        }
    </style>
</head>
